name: Update Mutual Fund Report

on:
  schedule:
    # Runs daily at 06:00 UTC (~11:30 AM IST). Adjust as you like.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: |
          python mutual_fund_report.py \
            --provider-csv sample_supplementary_data.csv \
            --output-dir docs \
            --export html \
            --timeout 30 \
            --workers 5
          mv docs/report.html docs/index.html

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Auto-update report $(date -u +'%Y-%m-%d')"
          git push
